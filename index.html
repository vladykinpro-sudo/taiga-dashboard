<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тайга · Работа Мастерской продаж</title>
<style>
:root {
  --bg: #0e1116;
  --bg-2: #141821;
  --card: #171b22;
  --card-2: #1f242d;
  --card-hover: #232935;
  --border: #2a2f3a;
  --border-strong: #3a4050;
  --text: #e8eaed;
  --text-dim: #9ba3ae;
  --text-muted: #6b7280;
  --brand: #d4b26a;
  --accent: #3b82f6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --stage-1: #ef4444;
  --stage-2: #f59e0b;
  --stage-3: #3b82f6;
  --stage-4: #10b981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  padding: 14px 32px; display: flex; justify-content: space-between; align-items: center;
}
.topbar-left { display: flex; align-items: center; gap: 24px; }
.brand-mark { font-size: 11px; letter-spacing: 3px; color: var(--brand); font-weight: 600; }
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-title small { color: var(--text-dim); font-weight: 400; margin-left: 8px; }
.topbar-right { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); }
.live-dot {
  display: inline-block; width: 8px; height: 8px; background: var(--success); border-radius: 50%;
  margin-right: 6px; box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite;
}
.live-dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.live-dot.wait { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
@keyframes pulse { 0%,100% {opacity:1;} 50% {opacity:0.5;} }
.refresh-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
  padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s;
}
.refresh-btn:hover { background: var(--card-hover); color: var(--text); }
.refresh-btn:disabled { opacity: 0.5; cursor: wait; }

.filterbar {
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  padding: 12px 32px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.filter-pills { display: flex; gap: 4px; }
.filter-pill {
  padding: 6px 12px; background: var(--card); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 20px; font-size: 12px; cursor: pointer;
  transition: all 0.15s; user-select: none;
}
.filter-pill:hover { background: var(--card-hover); color: var(--text); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: white; }
.filter-select {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; min-width: 200px;
}
.filter-select:focus { outline: none; border-color: var(--accent); }

.main { padding: 24px 32px 60px; max-width: 1600px; margin: 0 auto; }

/* Loading */
.loading-state {
  display: flex; align-items: center; justify-content: center;
  padding: 80px 20px; color: var(--text-dim); font-size: 14px; gap: 12px;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-state {
  padding: 40px 24px; background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2);
  border-radius: 10px; margin: 40px auto; max-width: 600px; text-align: center;
}
.error-state h3 { color: var(--danger); margin-bottom: 8px; }
.error-state p { color: var(--text-dim); font-size: 13px; }
.error-state code {
  display: block; margin-top: 12px; padding: 8px; background: var(--card);
  border-radius: 4px; font-size: 11px; color: var(--text-muted); word-break: break-all;
}

.section { margin-bottom: 24px; }
.section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.section-title { font-size: 12px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
.section-meta { font-size: 12px; color: var(--text-muted); }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; position: relative; overflow: hidden;
}
.kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.kpi-value { font-size: 28px; font-weight: 600; }
.kpi-value .unit { font-size: 14px; color: var(--text-dim); margin-left: 4px; font-weight: 400; }
.kpi-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.kpi-trend { position: absolute; top: 16px; right: 16px; font-size: 11px; padding: 2px 8px; border-radius: 8px; }
.kpi-trend.pos { background: rgba(16,185,129,0.15); color: var(--success); }
.kpi-trend.neg { background: rgba(239,68,68,0.15); color: var(--danger); }

.team-block {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin-bottom: 20px;
}
.team-block-title {
  font-size: 13px; font-weight: 600; margin-bottom: 16px; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.stage-track { position: relative; padding: 40px 0 24px; }
.stage-bar { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 3px; height: 6px; }
.stage-seg { border-radius: 3px; }
.stage-seg.s1 { background: rgba(239,68,68,0.25); }
.stage-seg.s2 { background: rgba(245,158,11,0.25); }
.stage-seg.s3 { background: rgba(59,130,246,0.25); }
.stage-seg.s4 { background: rgba(16,185,129,0.25); }
.stage-labels {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 3px;
  margin-top: 10px; font-size: 11px; color: var(--text-muted); text-align: center;
}
.stage-labels span { text-transform: uppercase; letter-spacing: 1px; }
.stage-pin {
  position: absolute; top: 8px; transform: translateX(-50%);
  padding: 4px 10px; border: 2px solid var(--bg); border-radius: 14px;
  font-size: 11px; font-weight: 600; color: white; cursor: pointer;
  white-space: nowrap; transition: transform 0.15s;
}
.stage-pin:hover { transform: translateX(-50%) scale(1.1); z-index: 3; }
.stage-pin.s1 { background: var(--stage-1); }
.stage-pin.s2 { background: var(--stage-2); }
.stage-pin.s3 { background: var(--stage-3); }
.stage-pin.s4 { background: var(--stage-4); }
.stage-empty { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 13px; }

.expand-header {
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; transition: background 0.15s; user-select: none;
}
.expand-header:hover { background: var(--card-hover); }
.expand-header.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.expand-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.expand-icon {
  width: 20px; height: 20px; border-radius: 50%; background: var(--card-2);
  display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform 0.2s;
}
.expand-header.open .expand-icon { transform: rotate(45deg); }
.expand-body { display: none; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; background: var(--card); }
.expand-body.open { display: block; }

.managers-list { padding: 4px 12px 12px; }
.managers-list-header {
  display: grid;
  grid-template-columns: 40px 200px 140px 100px 1fr 140px 100px;
  gap: 16px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--card-2);
}
.mh-cell {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}
.mh-avatar { width: 36px; }
.manager-row {
  display: grid; grid-template-columns: 40px 200px 140px 100px 1fr 140px 100px;
  gap: 16px; align-items: center; padding: 14px 12px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
}
.manager-row:hover { background: var(--card-hover); }
.manager-row:last-child { border-bottom: none; }
.manager-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--card-2);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: var(--text);
}
.manager-name-cell { font-size: 14px; font-weight: 500; }
.manager-name-cell small { color: var(--text-muted); font-weight: 400; display: block; font-size: 11px; margin-top: 2px; }
.stage-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border);
}
.stage-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.stage-badge.s1 .dot { background: var(--stage-1); }
.stage-badge.s2 .dot { background: var(--stage-2); }
.stage-badge.s3 .dot { background: var(--stage-3); }
.stage-badge.s4 .dot { background: var(--stage-4); }
.manager-score { font-size: 18px; font-weight: 600; }
.mini-chart { height: 32px; display: flex; align-items: flex-end; gap: 3px; }
.mini-bar { flex: 1; background: var(--accent); border-radius: 2px; opacity: 0.7; min-height: 4px; }
.mini-bar:last-child { opacity: 1; }
.mini-chart-wrap { display: flex; flex-direction: column; gap: 4px; }
.mini-chart-label {
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  font-weight: 500;
}

/* Профиль команды по этапам продаж */
.team-profile-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-top: 20px;
  margin-bottom: 20px;
}
.team-profile-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.team-profile-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.team-profile-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}
.team-profile-legend-top {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  max-width: 60%;
}
.team-profile-legend-top .legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-dim);
}
.team-profile-legend-top .legend-swatch {
  width: 14px;
  height: 3px;
  border-radius: 2px;
}
.team-profile-svg-wrap {
  width: 100%;
  overflow-x: auto;
}
.team-profile-svg {
  display: block;
  width: 100%;
  height: auto;
  min-width: 600px;
  max-height: 300px;
}
.team-profile-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 13px;
}
.manager-activity { font-size: 12px; color: var(--text-dim); }
.open-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.15s;
}
.open-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }
.no-data-row {
  padding: 30px 20px; text-align: center; color: var(--text-muted); font-size: 13px;
}

.activity-feed { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.feed-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed-item:last-child { border-bottom: none; }
.feed-time { font-size: 11px; color: var(--text-muted); min-width: 70px; }
.feed-text { flex: 1; color: var(--text-dim); }
.feed-text b { color: var(--text); font-weight: 500; }
.feed-tag {
  padding: 2px 8px; border-radius: 6px; font-size: 10px;
  text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}
.feed-tag.call { background: rgba(59,130,246,0.15); color: var(--accent); }
.feed-tag.meeting { background: rgba(212,178,106,0.15); color: var(--brand); }
.feed-tag.strong { background: rgba(16,185,129,0.15); color: var(--success); }
.feed-tag.rec { background: rgba(245,158,11,0.15); color: var(--warning); }

.two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

/* Кнопка Показать все встречи */
.show-all-btn {
  margin-top: 10px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.show-all-btn:hover {
  background: var(--card-hover);
  color: var(--text);
  border-color: var(--brand);
}

/* Модалка всех встреч */
.all-meetings-modal .modal {
  max-width: 900px;
}
.meetings-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.meeting-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  transition: all 0.15s;
  cursor: pointer;
}
.meeting-card:hover {
  background: var(--card-hover);
  border-color: var(--brand);
}
.meeting-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.meeting-card-manager {
  font-size: 14px;
  font-weight: 600;
}
.meeting-card-date {
  font-size: 12px;
  color: var(--text-muted);
}
.meeting-card-meta {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.meeting-meta-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--card-2);
  color: var(--text-dim);
}
.meeting-meta-tag.stage-s1 { background: rgba(239,68,68,0.15); color: var(--danger); }
.meeting-meta-tag.stage-s2 { background: rgba(245,158,11,0.15); color: var(--warning); }
.meeting-meta-tag.stage-s3 { background: rgba(59,130,246,0.15); color: var(--accent); }
.meeting-meta-tag.stage-s4 { background: rgba(16,185,129,0.15); color: var(--success); }
.meeting-card-insight {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
}
.meetings-date-group {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.meetings-date-group:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}
.meetings-date-group-title {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.meetings-summary-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.meetings-summary-item { text-align: center; }
.meetings-summary-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
}
.meetings-summary-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 200; display: none;
  align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 14px; max-width: 1200px; width: 100%; overflow: hidden;
}
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: flex-start;
}
.modal-title-block h2 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.modal-title-block .sub { font-size: 13px; color: var(--text-dim); }
.modal-close {
  background: transparent; border: none; color: var(--text-dim); font-size: 24px;
  cursor: pointer; padding: 4px 12px; border-radius: 6px; transition: all 0.15s;
}
.modal-close:hover { background: var(--card); color: var(--text); }
.modal-tabs { display: flex; gap: 4px; padding: 12px 24px 0; border-bottom: 1px solid var(--border); }
.modal-tab {
  padding: 10px 16px; background: transparent; border: none; color: var(--text-dim);
  font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s; font-family: inherit;
}
.modal-tab:hover { color: var(--text); }
.modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }

.mod-stage {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin-bottom: 20px;
}
.mod-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.mod-comp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.mod-comp { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.mod-comp-name { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.mod-comp-values { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.mod-comp-now { font-size: 24px; font-weight: 700; }
.mod-comp-detail { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
.mod-comp-bar { height: 4px; background: var(--card-2); border-radius: 2px; overflow: hidden; }
.mod-comp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 2px; transition: width 0.4s; }

.calls-table {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; border-collapse: collapse;
}
.calls-table th, .calls-table td {
  padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px;
}
.calls-table th {
  background: var(--card-2); color: var(--text-muted);
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500;
}
.calls-table tr:last-child td { border-bottom: none; }
.calls-table tr:hover td { background: var(--card-hover); }
.call-type {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  font-size: 11px; background: var(--card-2); color: var(--text-dim);
}
.call-score-pill {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
}
.call-score-pill.high { background: rgba(16,185,129,0.15); color: var(--success); }
.call-score-pill.mid { background: rgba(59,130,246,0.15); color: var(--accent); }
.call-score-pill.low { background: rgba(245,158,11,0.15); color: var(--warning); }

.fb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.fb-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.fb-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.fb-strong .fb-title { color: var(--success); }
.fb-rec .fb-title { color: var(--warning); }
.fb-item {
  padding: 10px 0; border-bottom: 1px solid var(--border);
  font-size: 13px; line-height: 1.55; color: var(--text-dim); display: flex; gap: 10px;
}
.fb-item:last-child { border-bottom: none; }
.fb-item small { font-size: 11px; color: var(--text-muted); min-width: 50px; }
.fb-item span b { color: var(--text); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Психологический портрет */
.portrait-hero {
  background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(16,185,129,0.05));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  margin-bottom: 20px;
}
.portrait-title { font-size: 12px; letter-spacing: 2px; color: var(--brand); text-transform: uppercase; margin-bottom: 8px; }
.portrait-text { font-size: 15px; line-height: 1.7; color: var(--text); }
.stage-combined {
  display: flex;
  gap: 16px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.stage-src { flex: 1; }
.stage-src-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

<body>

<!-- Модалка -->

      <button class="modal-tab" data-tab="competencies" onclick="switchTab('competencies')">Компетенции</button>
      <button class="modal-tab" data-tab="calls" onclick="switchTab('calls')">Звонки</button>

  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-block">

        <div class="sub" id="allMeetingsSubtitle">—</div>
      </div>

<script>
// =============================
// КОНФИГ
// =============================
const API_URL = 'https://script.google.com/macros/s/AKfycby8WeNxEhf2nwyL_LfElvnByDRYxtUDlbl0CdDPRvMk0LRYDDoMA0VMYDYFk2fO4qZE/exec';

// Клиентские компетенции — группируем 39 параметров в 6 понятных блоков
const COMPETENCIES = [
  { code: 'contact', name: 'Установление контакта', params: ['p1','p2','p3','p4','p5','p6'] },
  { code: 'lead',    name: 'Ведение разговора',    params: ['p7'] },
  { code: 'need',    name: 'Выявление потребностей', params: ['p8','p9','p10','p11','p12','p13','p14','p15','p16','p17','p18'] },
  { code: 'pitch',   name: 'Презентация ценности', params: ['p19','p20','p21','p22','p23','p24','p25'] },
  { code: 'object',  name: 'Работа с возражениями', params: ['p26','p27','p28','p29','p30'] },
  { code: 'close',   name: 'Закрытие и next step', params: ['p31','p32','p33','p34'] }
];

// Состояние
let rawData = null;
let filters = { period: 'month', manager: 'all', type: 'all' };

// =============================
// ЗАГРУЗКА
// =============================
async function loadData() {
  setStatus('wait', 'Загружаю данные...');
  document.getElementById('refreshBtn').disabled = true;
  
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    
    rawData = json;
    const timeStr = formatUpdatedAt(json.updated_at);
    setStatus('ok', `Обновлено: ${timeStr}`);
    populateManagerFilter();
    render();
  } catch (err) {
    setStatus('err', 'Ошибка загрузки');
    document.getElementById('mainContent').innerHTML = `
      <div class="error-state">
        <h3>Не удалось загрузить данные</h3>
        <p>Проверь URL эндпоинта и настройки доступа Apps Script.</p>
        <code>${escapeHtml(String(err))}</code>
      </div>
    `;
  } finally {
    document.getElementById('refreshBtn').disabled = false;
  }
}

function reloadData() { loadData(); }

function setStatus(kind, text) {
  const dot = document.querySelector('.live-dot');
  dot.classList.remove('wait', 'err');
  if (kind === 'wait') dot.classList.add('wait');
  else if (kind === 'err') dot.classList.add('err');
  document.getElementById('statusText').textContent = text;
}

function formatUpdatedAt(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
  } catch { return '—'; }
}

// =============================
// АГРЕГАЦИЯ
// =============================

// Возвращает отфильтрованный список звонков
function filteredCalls() {
  if (!rawData) return [];
  let calls = rawData.calls_scored.slice();
  
  if (filters.manager !== 'all') {
    calls = calls.filter(c => c.manager === filters.manager);
  }
  if (filters.type !== 'all') {
    calls = calls.filter(c => c.call_type === filters.type);
  }
  if (filters.period !== 'all') {
    const now = new Date();
    let cutoff;
    if (filters.period === 'week') cutoff = new Date(now.getTime() - 7 * 86400000);
    else if (filters.period === 'month') cutoff = new Date(now.getTime() - 31 * 86400000);
    else if (filters.period === 'quarter') cutoff = new Date(now.getTime() - 93 * 86400000);
    
    // Пока данные все за июль 2026 (будущее относительно фактического сейчас) — 
    // не режем по времени если оно даёт 0. Иначе всё пустое.
    const filteredByDate = calls.filter(c => {
      const d = new Date(c.call_date);
      return d >= cutoff;
    });
    if (filteredByDate.length > 0) calls = filteredByDate;
  }
  
  return calls;
}

// % по параметру: 1/(1+0), NA исключаются
function pctForParam(calls, paramKey) {
  let ones = 0, zeros = 0;
  for (const c of calls) {
    const v = c[paramKey];
    if (v === 1 || v === '1') ones++;
    else if (v === 0 || v === '0') zeros++;
  }
  if (ones + zeros === 0) return null;
  return Math.round((ones / (ones + zeros)) * 100);
}

// % по группе параметров (компетенции)
function pctForGroup(calls, paramKeys) {
  let ones = 0, zeros = 0;
  for (const c of calls) {
    for (const p of paramKeys) {
      const v = c[p];
      if (v === 1 || v === '1') ones++;
      else if (v === 0 || v === '0') zeros++;
    }
  }
  if (ones + zeros === 0) return null;
  return Math.round((ones / (ones + zeros)) * 100);
}

// Средний pct_score по звонкам
function avgPctScore(calls) {
  if (calls.length === 0) return null;
  const sum = calls.reduce((acc, c) => acc + (parseFloat(c.pct_score) * 100 || 0), 0);
  return Math.round(sum / calls.length);
}

// Стадия из среднего балла
function stageFromScore(score) {
  if (score === null) return { code: 's1', name: 'Нет данных', pos: 12.5 };
  if (score < 55) return { code: 's1', name: 'Отрицание', pos: 12.5 };
  if (score < 70) return { code: 's2', name: 'Осознание', pos: 37.5 };
  if (score < 85) return { code: 's3', name: 'Имитация', pos: 62.5 };
  return { code: 's4', name: 'Интеграция', pos: 87.5 };
}

// Все уникальные менеджеры
function allManagers() {
  if (!rawData) return [];
  const set = new Set();
  rawData.calls_scored.forEach(c => c.manager && set.add(c.manager));
  return Array.from(set).sort();
}

// Данные по одному менеджеру
function managerStats(name) {
  const allCalls = rawData.calls_scored.filter(c => c.manager === name);
  const period = filteredCalls().filter(c => c.manager === name);
  const avg = avgPctScore(period);
  const stage = stageFromScore(avg);
  
  return {
    name,
    company: allCalls[0]?.company || '',
    calls_period: period,
    calls_all: allCalls,
    count_period: period.length,
    count_all: allCalls.length,
    avg_score: avg,
    stage
  };
}

// =============================
// РЕНДЕР ГЛАВНОГО ЭКРАНА
// =============================
function render() {
  if (!rawData) return;
  
  const calls = filteredCalls();
  const managers = allManagers();
  const managerStats_ = managers.map(m => managerStats(m));
  
  // KPI команды
  const totalCalls = calls.length;
  const totalMeetings = (rawData.meetings_scored || []).length;
  const teamAvg = avgPctScore(calls);
  
  // Распределение по стадиям
  const stageDist = { s1: 0, s2: 0, s3: 0, s4: 0 };
  managerStats_.forEach(m => { if (m.stage.code !== 'unknown') stageDist[m.stage.code]++; });
  
  const stageDistHtml = `
    <span style="color: var(--stage-1)">●</span> ${stageDist.s1}
    <span style="color: var(--stage-2); margin-left: 8px">●</span> ${stageDist.s2}
    <span style="color: var(--stage-3); margin-left: 8px">●</span> ${stageDist.s3}
    <span style="color: var(--stage-4); margin-left: 8px">●</span> ${stageDist.s4}
  `;
  
  const pinsHtml = managerStats_.map((m, idx) => {
    // Разнесём пины по горизонтали внутри стадии
    const base = m.stage.pos;
    const jitter = (idx % 3 - 1) * 4;
    const left = Math.max(3, Math.min(97, base + jitter));
    return `<div class="stage-pin ${m.stage.code}" style="left: ${left}%; top: ${8 + (idx % 2) * 32}px;" onclick="openManager('${escapeAttr(m.name)}')">${escapeHtml(m.name)}</div>`;
  }).join('');
  
  // Активность — только встречи мастера, самые свежие сверху
  const meetingEvents = (rawData.meetings_scored || []).map(m => ({
    type: 'meeting',
    time: m.scored_at,
    date: m.meeting_date,
    manager: m.manager,
    key_insight: m.key_insight,
    stage: m.stage_calculated,
    duration: m.duration_min
  }));
  
  const allEvents = meetingEvents
    .sort((a,b) => new Date(b.date) - new Date(a.date))
    .slice(0, 6);
  
  const feedHtml = allEvents.length === 0 ? 
    '<div style="text-align:center; color:var(--text-muted); padding: 30px 20px;">Пока нет разобранных встреч<br><small>Загрузите транскрипты через форму «Анализ встречи»</small></div>' :
    allEvents.map(e => {
      const dateStr = formatCallDate(e.date);
      return `
        <div class="feed-item">
          <div class="feed-time">${dateStr}</div>
          <div class="feed-text">
            <b>${escapeHtml(e.manager)}</b> — встреча с мастером${e.duration ? ' (' + e.duration + ' мин)' : ''}
            <br><small style="color:var(--text-muted);">${escapeHtml(e.key_insight || 'разбор проведён')} · стадия: ${escapeHtml(e.stage || '—')}</small>
          </div>
          <div class="feed-tag meeting">Встреча</div>
        </div>
      `;
    }).join('');
  
  const totalMeetingsInFeed = meetingEvents.length;
  const showMoreBtn = totalMeetingsInFeed > 6 ? 
    `<div class="show-all-btn" onclick="openAllMeetings()">Показать все встречи (${totalMeetingsInFeed}) →</div>` : '';
  
  // Список задач команды из recommendations
  const topRecs = getTopRecommendations(5);
  const tasksHtml = topRecs.map((r, i) => `
    <div class="feed-item">
      <div class="feed-time" style="color: var(--brand); font-weight: 600;">${i+1}</div>
      <div class="feed-text"><b>${escapeHtml(r.text)}</b><br><small style="color:var(--text-muted);">Упоминается в ${r.count} звонках</small></div>
    </div>
  `).join('') || '<div style="text-align:center; color:var(--text-muted); padding: 20px;">Задачи собираются по мере разбора звонков</div>';
  
  const managerRowsHtml = managerStats_.length === 0 ? 
    '<div class="no-data-row">Пока нет данных. Прогони первого менеджера через форму n8n.</div>' :
    managerStats_.map(m => renderManagerRow(m)).join('');
  
  document.getElementById('mainContent').innerHTML = `
    <div class="section">
      <div class="section-header">
        <div class="section-title">Отдел «Работа с архитекторами»</div>
        <div class="section-meta">${managers.length} ${pluralize(managers.length, 'менеджер','менеджера','менеджеров')} · Мастер: Романова Анастасия</div>
      </div>
      
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-label">Разобрано звонков</div>
          <div class="kpi-value">${totalCalls}<span class="unit">${periodLabel(filters.period)}</span></div>
          <div class="kpi-sub">все автоматически AI-агентом</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Разборов с мастером</div>
          <div class="kpi-value">${totalMeetings}<span class="unit">встреч</span></div>
          <div class="kpi-sub">${totalMeetings > 0 ? 'проанализировано AI-агентом' : 'ждём первых загрузок'}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Средний балл команды</div>
          <div class="kpi-value">${teamAvg !== null ? teamAvg + '%' : '—'}</div>
          <div class="kpi-sub">по ${calls.length} ${pluralize(calls.length, 'звонку','звонкам','звонкам')} за период</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Распределение по стадиям</div>
          <div class="kpi-value" style="font-size: 18px; margin-top: 4px;">${stageDistHtml}</div>
          <div class="kpi-sub">Отрицание · Осознание · Имитация · Интеграция</div>
        </div>
      </div>
      
      <div class="team-block">
        <div class="team-block-title">Карта команды по 4 стадиям изменения поведения</div>
        <div class="stage-track">
          <div class="stage-bar">
            <div class="stage-seg s1"></div>
            <div class="stage-seg s2"></div>
            <div class="stage-seg s3"></div>
            <div class="stage-seg s4"></div>
          </div>
          ${pinsHtml || '<div class="stage-empty">Нет менеджеров с данными для отображения</div>'}
          <div class="stage-labels">
            <span>Отрицание</span><span>Осознание</span><span>Имитация</span><span>Интеграция</span>
          </div>
        </div>
      </div>
      
      <div class="expand-header" id="expandToggle" onclick="toggleExpand()">
        <div class="expand-title">
          <div class="expand-icon">+</div>
          Менеджеры команды (${managers.length})
        </div>
        <div style="font-size: 12px; color: var(--text-muted);">Клик — раскрыть список</div>
      </div>
      <div class="expand-body" id="expandBody">
        <div class="managers-list-header">
          <div class="mh-avatar"></div>
          <div class="mh-cell">Менеджер</div>
          <div class="mh-cell">Стадия</div>
          <div class="mh-cell">Средний балл</div>
          <div class="mh-cell">Динамика качества звонков</div>
          <div class="mh-cell">Активность</div>
          <div class="mh-cell"></div>
        </div>
        <div class="managers-list">${managerRowsHtml}</div>
      </div>
      
      ${renderTeamProfileBlock(managerStats_, calls)}
    </div>
    
    <div class="two-col">

function renderTeamProfileSvg(managers, allCalls) {
  const w = 900;
  const h = 300;
  const padTop = 20;
  const padBottom = 60;
  const padLeft = 60;
  const padRight = 30;
  const chartW = w - padLeft - padRight;
  const chartH = h - padTop - padBottom;
  const nStages = SALES_STAGES.length;
  
  // Позиция X для каждого этапа
  const xForStage = (i) => padLeft + (i / (nStages - 1)) * chartW;
  // Позиция Y для значения 0..100
  const yForVal = (v) => padTop + chartH - (v / 100) * chartH;
  
  // Сетка Y: 0, 20, 40, 60, 80, 100 — светлее для видимости
  const gridY = [0, 20, 40, 60, 80, 100].map(v => {
    const y = yForVal(v);
    const isBase = (v === 0);
    return `
      <line x1="${padLeft}" y1="${y}" x2="${w - padRight}" y2="${y}" stroke="${isBase ? '#5a6070' : '#3a4050'}" stroke-width="${isBase ? '1' : '0.5'}" ${isBase ? '' : 'stroke-dasharray="3,4"'}/>
      <text x="${padLeft - 10}" y="${y + 4}" font-size="11" fill="#9ba3ae" text-anchor="end">${v}%</text>
    `;
  }).join('');
  
  // Подписи этапов (X-axis)
  const stageLabels = SALES_STAGES.map((s, i) => {
    const x = xForStage(i);
    // Разбиваем на 2 строки для длинных названий
    const words = s.name.split(' ');
    let line1 = '', line2 = '';
    if (words.length <= 1) {
      line1 = s.name;
    } else {
      line1 = words[0];
      line2 = words.slice(1).join(' ');
    }
    return `
      <text x="${x}" y="${h - padBottom + 20}" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="500">${escapeHtml(line1)}</text>
      ${line2 ? `<text x="${x}" y="${h - padBottom + 36}" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="500">${escapeHtml(line2)}</text>` : ''}
    `;
  }).join('');
  
  // Вертикальные линии этапов — светлее
  const stageAxes = SALES_STAGES.map((_, i) => {
    const x = xForStage(i);
    return `<line x1="${x}" y1="${padTop}" x2="${x}" y2="${padTop + chartH}" stroke="#3a4050" stroke-width="0.5" stroke-dasharray="3,4"/>`;
  }).join('');
  
  // Левая ось Y (визуально)
  const leftAxis = `<line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${padTop + chartH}" stroke="#5a6070" stroke-width="1"/>`;
  
  // Линии менеджеров
  const managerLines = managers.map((m, idx) => {
    const color = MANAGER_COLORS[idx % MANAGER_COLORS.length];
    const points = SALES_STAGES.map((stage, i) => {
      const pct = pctForGroup(m.calls_period, stage.params);
      return { x: xForStage(i), y: pct !== null ? yForVal(pct) : null, val: pct };
    });
    const validPoints = points.filter(p => p.y !== null);
    if (validPoints.length === 0) return '';
    const pathD = validPoints.map((p, i) => (i === 0 ? 'M' : 'L') + ` ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const circles = validPoints.map(p => 
      `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${color}" stroke="#171b22" stroke-width="2"/>`
    ).join('');
    return `
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
      ${circles}
    `;
  }).join('');
  
  return `<svg class="team-profile-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    ${gridY}
    ${stageAxes}
    ${leftAxis}
    ${stageLabels}
    ${managerLines}
  </svg>`;
}

// Топ рекомендаций из calls_feedback
function getTopRecommendations(limit) {
  if (!rawData || !rawData.calls_feedback) return [];
  const recs = rawData.calls_feedback.filter(f => f.feedback_type === 'recommendation');
  // Группируем по первым 40 символам (грубая кластеризация одинаковых)
  const groups = {};
  recs.forEach(r => {
    const text = String(r.feedback_text || '');
    const key = text.slice(0, 40).toLowerCase();
    if (!groups[key]) groups[key] = { text, count: 0 };
    groups[key].count++;
  });
  return Object.values(groups).sort((a, b) => b.count - a.count).slice(0, limit);
}

// Радар в SVG (18 маркеров)
function renderRadarSvg(scores) {
  const size = 340;
  const cx = size / 2;
  const cy = size / 2;
  const rMax = 130;
  const n = 18;
  const points = [];
  const labels = [];
  
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const key = `m${i+1}`;
    const raw = scores[key];
    const score = (raw === 'NA' || raw === null || raw === undefined) ? 0 : Number(raw);
    const r = (score / 10) * rMax;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    // подпись
    const lx = cx + Math.cos(angle) * (rMax + 20);
    const ly = cy + Math.sin(angle) * (rMax + 20);
    labels.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" fill="#9ba3ae" text-anchor="middle" dominant-baseline="middle">m${i+1}</text>`);
  }
  
  // Кольца
  const rings = [0.25, 0.5, 0.75, 1].map(f => 
    `<circle cx="${cx}" cy="${cy}" r="${(rMax*f).toFixed(1)}" fill="none" stroke="#2a2f3a" stroke-width="1"/>`
  ).join('');
  
  // Оси
  const axes = [];
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + Math.cos(angle) * rMax;
    const y = cy + Math.sin(angle) * rMax;
    axes.push(`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a2f3a" stroke-width="0.5"/>`);
  }
  
  return `<svg width="100%" viewBox="0 0 ${size} ${size}" style="display:block;">
    ${rings}
    ${axes.join('')}
    <polygon points="${points.join(' ')}" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="2"/>
    ${points.map(p => {
      const [x,y] = p.split(',');
      return `<circle cx="${x}" cy="${y}" r="3" fill="#3b82f6"/>`;
    }).join('')}
    ${labels.join('')}
  </svg>`;
}

    </div>
    
    <div class="portrait-blocks">
      <div class="p-block p-block-strong">
        <div class="p-block-title">💪 Сильные стороны</div>
        <ul class="p-block-list">

// Рендер блока динамики

  if (!meetings || meetings.length === 0) return '';
  
  if (meetings.length === 1) {
    return `
      <div class="dynamics-block">
        <div class="dynamics-head">
          <div>
            <div class="dynamics-title">Динамика по категориям</div>
            <div class="dynamics-sub">Как менеджер меняется от встречи к встрече</div>
          </div>
        </div>
        <div class="dynamics-empty">
          Динамика появится после следующей встречи, когда будут данные для сравнения.<br>
          <small style="color: var(--text-muted);">Сейчас загружена ${meetings.length} встреча.</small>
        </div>
      </div>
    `;
  }
  
  const svgHtml = renderDynamicsSvg(meetings);
  
  const legendItems = [
    { key: 'A', color: '#3b82f6', name: 'Отношение к методологии' },
    { key: 'B', color: '#10b981', name: 'Ответственность' },
    { key: 'C', color: '#f59e0b', name: 'Психология' },
    { key: 'D', color: '#d4b26a', name: 'Продукт и клиенты' },
    { key: 'E', color: '#ef4444', name: 'Дисциплина' }
  ];
  const legendHtml = legendItems.map(l => 
    `<div class="legend-item"><div class="legend-swatch" style="background:${l.color}"></div>${l.name}</div>`
  ).join('');
  
  return `
    <div class="dynamics-block">
      <div class="dynamics-head">
        <div>
          <div class="dynamics-title">Динамика по категориям</div>
          <div class="dynamics-sub">${meetings.length} встреч, от ${formatCallDate(meetings[0].meeting_date)} до ${formatCallDate(meetings[meetings.length-1].meeting_date)}</div>
        </div>
      </div>
      <div class="dynamics-svg-wrap">
        ${svgHtml}
      </div>
      <div class="dynamics-legend">${legendHtml}</div>
    </div>
  `;
}

// SVG график динамики
function renderDynamicsSvg(meetings) {
  const w = 800;
  const h = 260;
  const padTop = 20;
  const padBottom = 40;
  const padLeft = 30;
  const padRight = 20;
  const chartW = w - padLeft - padRight;
  const chartH = h - padTop - padBottom;
  const n = meetings.length;
  
  const categories = [
    { key: 'category_A', color: '#3b82f6' },
    { key: 'category_B', color: '#10b981' },
    { key: 'category_C', color: '#f59e0b' },
    { key: 'category_D', color: '#d4b26a' },
    { key: 'category_E', color: '#ef4444' }
  ];
  
  // Горизонтальные линии сетки 0, 2, 4, 6, 8, 10
  const gridLines = [];
  for (let v = 0; v <= 10; v += 2) {
    const y = padTop + chartH - (v / 10) * chartH;
    gridLines.push(`<line x1="${padLeft}" y1="${y}" x2="${w - padRight}" y2="${y}" stroke="#2a2f3a" stroke-width="0.5"/>`);
    gridLines.push(`<text x="${padLeft - 6}" y="${y + 3}" font-size="10" fill="#6b7280" text-anchor="end">${v}</text>`);
  }
  
  // Подписи дат по оси X
  const dateLabels = meetings.map((m, i) => {
    const x = n === 1 ? padLeft + chartW/2 : padLeft + (i / (n-1)) * chartW;
    const date = formatCallDate(m.meeting_date);
    return `<text x="${x}" y="${h - padBottom + 16}" font-size="10" fill="#9ba3ae" text-anchor="middle">${date}</text>`;
  }).join('');
  
  // Линии категорий
  const catLines = categories.map(cat => {
    const points = meetings.map((m, i) => {
      const x = n === 1 ? padLeft + chartW/2 : padLeft + (i / (n-1)) * chartW;
      const val = Number(m[cat.key]);
      const y = isNaN(val) ? padTop + chartH : padTop + chartH - (val / 10) * chartH;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    
    const pathD = 'M ' + points.join(' L ');
    const circles = points.map(p => {
      const [x,y] = p.split(',');
      return `<circle cx="${x}" cy="${y}" r="4" fill="${cat.color}" stroke="#171b22" stroke-width="2"/>`;
    }).join('');
    
    return `
      <path d="${pathD}" fill="none" stroke="${cat.color}" stroke-width="2.5" stroke-linejoin="round"/>
      ${circles}
    `;
  }).join('');
  
  return `<svg class="dynamics-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    ${gridLines.join('')}
    ${catLines}
    ${dateLabels}
  </svg>`;
}

function renderFeedbackBlock(manager, type, title) {
  const items = (rawData.calls_feedback || [])
    .filter(f => f.manager === manager && f.feedback_type === type)
    .sort((a,b) => new Date(b.call_date) - new Date(a.call_date))
    .slice(0, 5);
  
  const cls = type === 'strong' ? 'fb-strong' : 'fb-rec';
  const itemsHtml = items.map(i => {
    const date = formatCallDate(i.call_date);
    return `<div class="fb-item"><small>${date}</small><span>${escapeHtml(i.feedback_text)}</span></div>`;
  }).join('') || '<div class="fb-item"><span style="color: var(--text-muted);">Пока нет данных</span></div>';
  
  return `<div class="fb-block ${cls}"><div class="fb-title">${title}</div>${itemsHtml}</div>`;
}

function getManagerTopRecs(manager, limit) {
  const recs = (rawData.calls_feedback || []).filter(f => f.manager === manager && f.feedback_type === 'recommendation');
  const groups = {};
  recs.forEach(r => {
    const text = String(r.feedback_text || '');
    const key = text.slice(0, 40).toLowerCase();
    if (!groups[key]) groups[key] = { text, count: 0 };
    groups[key].count++;
  });
  return Object.values(groups).sort((a,b) => b.count - a.count).slice(0, limit);
}

// =============================
// УТИЛИТЫ
// =============================
function formatCallDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
  } catch { return '—'; }
}

function getInitials(name) {
  return String(name).split(/\s+/).map(s => s[0]).join('').slice(0, 2).toUpperCase();
}

function periodLabel(p) {
  return {week:'за неделю', month:'за месяц', quarter:'за квартал', all:'за всё время'}[p] || '';
}

function pluralize(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

function callTypeBreakdown(calls) {
  const types = {};
  calls.forEach(c => types[c.call_type] = (types[c.call_type] || 0) + 1);
  return Object.entries(types).map(([k, v]) => `${k}: ${v}`).join(', ') || '—';
}

    s4: 'Стадия «Интеграция» — новое поведение стало нормой. Работа мастера смещается на поддержание и точечное развитие сложных навыков (возражения, глубокое выявление).'

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, ''); }

// Модалка всех встреч
function openAllMeetings() {
  const meetings = (rawData.meetings_scored || []).slice()
    .sort((a,b) => new Date(b.meeting_date) - new Date(a.meeting_date));
  
  if (meetings.length === 0) {
    document.getElementById('allMeetingsBody').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">Пока нет разобранных встреч</div>';
    document.getElementById('modalAllMeetings').classList.add('open');
    return;
  }
  
  // Уникальные менеджеры
  const uniqueManagers = new Set(meetings.map(m => m.manager)).size;
  // Общая длительность
  const totalDuration = meetings.reduce((sum, m) => sum + (Number(m.duration_min) || 0), 0);
  const totalHours = Math.floor(totalDuration / 60);
  const totalMins = totalDuration % 60;
  const durationStr = totalHours > 0 ? `${totalHours}ч ${totalMins}м` : `${totalMins}м`;
  
  // Диапазон дат
  const firstDate = formatCallDate(meetings[meetings.length-1].meeting_date);
  const lastDate = formatCallDate(meetings[0].meeting_date);
  
  document.getElementById('allMeetingsSubtitle').textContent = 
    `${meetings.length} встреч · ${uniqueManagers} ${pluralize(uniqueManagers, 'менеджер','менеджера','менеджеров')} · период ${firstDate} — ${lastDate}`;
  
  // Группировка по месяцам
  const byMonth = {};
  meetings.forEach(m => {
    const d = new Date(m.meeting_date);
    const monthKey = d.toLocaleDateString('ru-RU', { year: 'numeric', month: 'long' });
    if (!byMonth[monthKey]) byMonth[monthKey] = [];
    byMonth[monthKey].push(m);
  });
  
  const monthGroupsHtml = Object.entries(byMonth).map(([month, ms]) => {
    const cardsHtml = ms.map(m => renderMeetingCard(m)).join('');
    return `
      <div class="meetings-date-group">
        <div class="meetings-date-group-title">${escapeHtml(month)} · ${ms.length} ${pluralize(ms.length, 'встреча','встречи','встреч')}</div>
        <div class="meetings-list">${cardsHtml}</div>
      </div>
    `;
  }).join('');
  
  const summaryBarHtml = `
    <div class="meetings-summary-bar">
      <div class="meetings-summary-item">
        <div class="meetings-summary-value">${meetings.length}</div>
        <div class="meetings-summary-label">встреч всего</div>
      </div>
      <div class="meetings-summary-item">
        <div class="meetings-summary-value">${uniqueManagers}</div>
        <div class="meetings-summary-label">менеджеров</div>
      </div>
      <div class="meetings-summary-item">
        <div class="meetings-summary-value">${durationStr}</div>
        <div class="meetings-summary-label">суммарно</div>
      </div>
    </div>
  `;
  
  document.getElementById('allMeetingsBody').innerHTML = summaryBarHtml + monthGroupsHtml;
  document.getElementById('modalAllMeetings').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeAllMeetings() {
  document.getElementById('modalAllMeetings').classList.remove('open');
  if (!document.getElementById('modal').classList.contains('open')) {
    document.body.style.overflow = '';
  }
}

function renderMeetingCard(m) {
  const dateStr = formatCallDate(m.meeting_date);
  const stageCode = stageCodeFromName(m.stage_calculated);
  const durationStr = m.duration_min ? `${m.duration_min} мин` : '';
  
  return `
    <div class="meeting-card" onclick="openManager('${escapeAttr(m.manager)}'); closeAllMeetings();">
      <div class="meeting-card-head">
        <div class="meeting-card-manager">${escapeHtml(m.manager)}</div>
        <div class="meeting-card-date">${dateStr}</div>
      </div>
      <div class="meeting-card-meta">
        ${durationStr ? `<span class="meeting-meta-tag">${durationStr}</span>` : ''}
        ${m.stage_calculated ? `<span class="meeting-meta-tag stage-${stageCode}">Стадия: ${escapeHtml(m.stage_calculated)}</span>` : ''}
      </div>
      <div class="meeting-card-insight">${escapeHtml(m.key_insight || 'разбор проведён')}</div>
    </div>
  `;
}

  group.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  filters[key] = pill.dataset.val;
  render();
